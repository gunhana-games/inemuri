<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1d1a17; font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }

  #blur { position: absolute; inset: 0; }
  #viewport { position: absolute; inset: 0; overflow: hidden; background: #d9cdb8; }
  #viewport.shake { animation: bossShake .5s ease-out; }
  @keyframes bossShake { 0% { transform: translate(0, 0); } 15% { transform: translate(-9px, 5px); } 30% { transform: translate(8px, -6px); } 45% { transform: translate(-6px, 3px); } 60% { transform: translate(4px, -2px); } 80% { transform: translate(-2px, 1px); } 100% { transform: translate(0, 0); } }
  #camera { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
  /* 時間帯の色。重い「乗算」をやめて、半透明の色を重ねるだけにした */
  #tint { position: absolute; inset: 0; pointer-events: none; transition: background 1.5s; }
  #dark { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; }
  /* 肖像画の光る目は、夜の暗さの上に重ねて描く（暗さで消えないように） */
  #eyeGlow { position: absolute; inset: 0; pointer-events: none; }
  #eyeGlow i { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff6b0; box-shadow: 0 0 6px 3px rgba(255,220,60,.9); }
  #eyeGlow.strong i { width: 8px; height: 8px; margin: -4px 0 0 -4px; background: #fffbe0; box-shadow: 0 0 10px 5px rgba(255,210,40,1); }
  .f { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .g { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }

  /* 部屋 */
  .wall { background: linear-gradient(#efe6d4, #e3d6bd 70%, #cdb994); }
  .wallL { background: linear-gradient(#f3ead8, #e6d9bf 70%, #d0bc97); }
  .floor { background: repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 60px), linear-gradient(#a9764a, #8c5e38); }
  .ceil { background: linear-gradient(#f1ece2, #e6dfd2); }
  .lamp { background: #fffef6; box-shadow: 0 0 14px rgba(255,255,235,.9); border: 2px solid #ddd8cc; }
  .board { background: radial-gradient(ellipse at 40% 30%, #3f6b52, #2d4f3c 70%); border: 10px solid #8a5a33; box-shadow: inset 0 0 30px rgba(0,0,0,.35); color: #f4f1e6; font-weight: bold; padding: 14px 20px; overflow: hidden; }
  .board .chalk { font-size: 22px; line-height: 1.5; text-shadow: 0 0 1px rgba(255,255,255,.6); white-space: pre; letter-spacing: 1px; }
  .board .date { position: absolute; right: 18px; top: 10px; font-size: 15px; writing-mode: vertical-rl; opacity: .9; }
  .window { background: linear-gradient(#9fd0ee, #cfe8f2 55%, #fbe3b8); border: 7px solid #e9e4da; box-shadow: inset 0 0 0 3px #bcb4a6; transition: background 1.5s; }
  .window::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: #e9e4da; }
  .ph-evening .window { background: linear-gradient(#e9875a, #f5b56f 55%, #ffd9a0); }
  .ph-night .window { background: radial-gradient(circle at 20% 30%, #fff 0 1px, transparent 2px), radial-gradient(circle at 70% 20%, #fff 0 1px, transparent 2px), radial-gradient(circle at 45% 60%, #fff 0 1px, transparent 2px), linear-gradient(#0d1430, #1d2a55); }
  .ph-midnight .window { background: radial-gradient(circle at 30% 40%, #fff 0 1px, transparent 2px), radial-gradient(circle at 75% 25%, #fff 0 1px, transparent 2px), linear-gradient(#05081a, #101a3c); }
  .ph-midnight .window.moon { background: radial-gradient(circle at 60% 30%, #fff8d0 0 9px, transparent 10px), linear-gradient(#05081a, #101a3c); }  /* 月は1つの窓にだけ */
  .zzz span { display: inline-block; color: #2c3550; font-size: 19px; font-weight: 900; font-style: italic; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; animation: zzz 2.4s ease-in-out infinite; }
  @keyframes zzz { 0% { transform: translate(0, 6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(10px, -10px); opacity: 0; } }
  .ph-dawn .window { background: linear-gradient(#7d8fd6, #f6a6b6 55%, #ffd7a1); }
  .sun { background: rgba(255, 236, 190, .28); transition: opacity 1.5s; }
  .ph-evening .sun { background: rgba(255, 170, 90, .35); }
  .ph-night .sun, .ph-midnight .sun { opacity: 0; }
  /* 理科室・音楽室 */
  .floor.carpet { background: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.5px) 0 0 / 6px 6px, linear-gradient(#93303f, #6e2230); }
  .wall.music, .wallL.music { background: linear-gradient(transparent 0 63%, #6b4a2b 63% 65%, #b07a4c 65%), radial-gradient(circle, rgba(60,50,40,.28) 1.3px, transparent 1.8px) 0 0 / 11px 11px, linear-gradient(#fbf9f3, #efeae0); }
  .ceil.music { background: radial-gradient(circle, rgba(60,50,40,.18) 1.2px, transparent 1.7px) 0 0 / 12px 12px, #f5f2ea; }
  .curtain { background: repeating-linear-gradient(90deg, #8a2333 0 6px, #a8394a 6px 12px); border-top: 6px solid #6b4a2b; }
  .floor.tile { background: repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 2px, transparent 2px 50px), repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 2px, transparent 2px 50px), linear-gradient(#b9b4a6, #9c978a); }
  .board.staff { background: repeating-linear-gradient(transparent 0 92px, rgba(255,255,255,.35) 92px 94px, transparent 94px 104px), radial-gradient(ellipse at 40% 30%, #3f6b52, #2d4f3c 70%); }
  .ptable { background: #fbfaf4; border: 4px solid #6b4a2b; padding: 4px 6px; }
  .ptable b { display: block; font-size: 11px; color: #333; text-align: center; }
  .ptable div { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; margin-top: 3px; }
  .ptable i { display: block; height: 11px; border-radius: 1px; }
  .sink { border: 3px solid #6f777c; border-radius: 4px; }
  .portrait { background: #6b4a2b; padding: 5px; border-radius: 3px; }
  .portrait .pf { position: relative; width: 50px; height: 66px; background: linear-gradient(#d8c9a3, #b9a77c); overflow: hidden; }
  .portrait .pf i { position: absolute; display: block; }
  .portrait .coat { left: 4px; right: 4px; bottom: -6px; height: 22px; border-radius: 12px 12px 0 0; }
  .portrait .fc { left: 13px; top: 12px; width: 24px; height: 28px; border-radius: 45%; background: #efcfae; }
  .portrait .ey { top: 23px; width: 6px; height: 5px; border-radius: 50%; background: #fff; overflow: hidden; }
  .portrait .pp { left: 0; top: 1px; width: 3px; height: 3px; border-radius: 50%; background: #222; transition: transform 1.2s; }
  .portrait .mo { left: 20px; top: 33px; width: 10px; height: 2px; background: #8a4a3a; }
  .portrait b { display: block; font-size: 9px; color: #f6f3e8; text-align: center; margin-top: 2px; white-space: nowrap; }
  /* ふだんは横（窓の方）を見ている。夜（10〜15限）は目がずっと黄色く光ってこっちを見る */
  .ph-night .portrait .pp, .port-watch .portrait .pp { transform: translate(1.5px, 0.5px); }
  .ph-night .portrait .ey { background: #ffe95a; box-shadow: 0 0 7px 3px rgba(255,225,70,.95); }
  /* 真夜中（16〜21限）は「見張り」：ちらつく（予兆）→ 強く光る（見られている） */
  .port-warn .portrait .ey { animation: flick .16s steps(2) infinite; }
  @keyframes flick { 0% { background: #fff; box-shadow: none; } 50% { background: #ffe95a; box-shadow: 0 0 6px 3px rgba(255,225,70,.8); } }
  .port-watch .portrait .ey { background: #ffe95a; box-shadow: 0 0 10px 5px rgba(255,220,60,1); }
  .clock { border-radius: 50%; background: #fff; border: 6px solid #444; }
  .clock .hand { position: absolute; left: 50%; bottom: 50%; background: #222; transform-origin: 50% 100%; border-radius: 2px; }
  .notice { background: #c49a6c; border: 5px solid #8a5a33; }
  .paper { position: absolute; background: #fbfaf4; box-shadow: 1px 1px 0 rgba(0,0,0,.15); }
  .door { background: linear-gradient(90deg, #b7895d, #a77b51); border: 5px solid #7a5432; transform-origin: 0 50%; }
  .door::before { content: ""; position: absolute; left: 22%; top: 12%; width: 56%; height: 26%; background: #cfe3ec; border: 4px solid #7a5432; }

  /* まぶた */
  .lid { position: absolute; left: -10%; width: 120%; height: 0; background: #0d0b0a; z-index: 5; pointer-events: none; }
  #lidTop { top: 0; border-radius: 0 0 50% 50% / 0 0 35% 35%; }
  #lidBot { bottom: 0; border-radius: 50% 50% 0 0 / 35% 35% 0 0; }

  /* 画面上の表示（教室になじむよう、黒板・答案用紙の見た目にする） */
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 10px 12px 0; z-index: 6; pointer-events: none; display: flex; align-items: flex-start; gap: 10px; }
  /* 左上：学校の時間割表（黒板の色・木のふち） */
  #ttable { flex: none; width: 176px; padding: 4px 6px 6px; border-radius: 10px; border: 4px solid #8a5a33; background: radial-gradient(ellipse at 30% 20%, #47775c, #2d4f3c 75%); color: #f6f3e8; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  #ttHead { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 0 2px 3px; font-size: 11px; font-weight: bold; }
  #ttTitle { letter-spacing: 1px; white-space: nowrap; }
  #pPhase { display: inline-block; font-size: 10px; font-weight: bold; padding: 0 7px; border-radius: 999px; background: #ffd75e; color: #3a2a12; white-space: nowrap; }
  #pPhase.evening { background: #ff9a5c; } #pPhase.night { background: #4a63a8; color: #fff; } #pPhase.midnight { background: #6b4fa8; color: #fff; } #pPhase.dawn { background: #ffb3c4; }
  .tt-row { position: relative; display: flex; align-items: center; gap: 5px; height: 21px; padding: 0 4px; border-top: 1px dashed rgba(255,255,255,.22); font-size: 13px; font-weight: bold; }
  .tt-row .n { width: 18px; font-size: 11px; opacity: .75; text-align: right; flex: none; }
  .tt-row .s { width: 30px; flex: none; letter-spacing: 1px; }
  .tt-row .t { flex: 1; min-width: 0; font-size: 10px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tt-row.done .n, .tt-row.done .s, .tt-row.done .t { opacity: .4; }
  .tt-row.done::after { content: "済"; position: absolute; right: 4px; top: 2px; width: 16px; height: 16px; border: 2px solid #ff6b6b; border-radius: 50%; color: #ff6b6b; font-size: 10px; line-height: 13px; text-align: center; transform: rotate(-14deg); }
  .tt-row.now { border-top-color: transparent; border-radius: 5px; background: rgba(255,215,94,.22); box-shadow: inset 0 0 0 2px #ffd75e; font-size: 14px; }
  .tt-row.now .s { color: #ffd75e; }
  .tt-row.now + .tt-row { border-top-color: transparent; }
  .tt-row.boss .t { color: #ff9a9a; opacity: 1; }
  .tt-row .bar { position: absolute; left: 3px; right: 3px; bottom: 2px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.35); }
  #pTimeFill { height: 100%; width: 100%; border-radius: 2px; background: #ffd75e; }
  #pCalls { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; }
  #pCalls i { position: absolute; top: -3px; width: 4px; height: 9px; margin-left: -2px; background: #ff5f7e; border-radius: 2px; }
  /* 右：起きていた時間・まちがい・一時停止 */
  #hudRight { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  /* スマホの細い画面：時間割と右側の表示を少し小さくして、重ならないようにする */
  @media (max-width: 480px) {
    #hud { gap: 8px; }
    #ttable { width: 150px; }
    .tt-row { gap: 4px; font-size: 12px; } .tt-row.now { font-size: 13px; }
    .tt-row .n { width: 15px; } .tt-row .s { width: 27px; } .tt-row .t { font-size: 9px; }
    #ttHead { font-size: 10px; }
    .tt-row .s { white-space: nowrap; letter-spacing: 0; }
    /* 右側は2段に：上に「起きていた時間」と一時停止、その下に「まちがい」 */
    #rightBox { gap: 6px !important; flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; }
    #zzzBox { order: 1; } #pauseBtn { order: 2; }
    #missBox { order: 3; width: 100%; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
    #missBox #missMarks { margin-top: 0; }
    #zzzBox, #missBox { font-size: 10px; }
    #zzzBox b { font-size: 12px; padding: 3px 5px; }
    #zzzCombo { font-size: 10px; }
    #missMarks { gap: 4px; }
    .m { width: 22px; height: 28px; }
    .m.x::after { font-size: 30px; }
    #pauseBtn { width: 34px; height: 34px; gap: 4px; }
    #pauseBtn i { width: 5px; height: 14px; }
    #eye { width: 40px; height: 24px; }
    #gauge { width: 28px; }
    #gaugeText { font-size: 12px; } #gaugeNum { font-size: 15px; min-width: 34px; }
  }
  #rightBox { display: flex; align-items: flex-start; gap: 10px; }
  #missBox { text-align: center; color: #fff; font-size: 12px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #missMarks { display: flex; gap: 6px; margin-top: 4px; }
  .m { position: relative; width: 30px; height: 38px; border-radius: 4px; border: 3px solid #222; background: #fdfcf6; background-image: repeating-linear-gradient(transparent 0 7px, #c9d6ea 7px 8px); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .m.x::after { content: "×"; position: absolute; inset: -8px -6px; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: #e23b3b; animation: stamp .35s cubic-bezier(.3,1.8,.5,1); }
  @keyframes stamp { from { transform: scale(2.4) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-8deg); opacity: 1; } }
  #zzzBox { text-align: center; color: #fff; font-size: 12px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #zzzBox b { display: block; margin-top: 4px; padding: 4px 8px; border-radius: 8px; border: 3px solid #222; background: #2c3550; color: #fff; font-size: 14px; text-shadow: none; box-shadow: 0 3px 0 rgba(0,0,0,.35); white-space: nowrap; }
  #zzzCombo { display: block; margin-top: 3px; color: #ffd75e; font-size: 12px; }
  /* セーフ！の演出（ギリギリで目を開けたとき） */
  #safe { position: absolute; left: 50%; top: 34%; z-index: 7; pointer-events: none; transform: translate(-50%, 0) scale(.6); opacity: 0; color: #ffd75e; font-size: 46px; font-weight: 900; text-align: center; -webkit-text-stroke: 2px #222; text-shadow: 0 4px 0 #222; }
  #safe span { font-size: 30px; margin-left: 6px; color: #fff; }
  #safe small { display: block; font-size: 16px; color: #fff; -webkit-text-stroke: 0; text-shadow: 0 2px 4px #000; }
  #safe.on { animation: safePop 1.8s ease-out forwards; }
  @keyframes safePop { 0% { opacity: 0; transform: translate(-50%, 0) scale(.5); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } 30% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px) scale(1); } }
  /* チョークが飛んでくる */
  #chalkFly { position: absolute; left: 40%; top: 30%; width: 34px; height: 9px; border-radius: 3px; background: #fff; box-shadow: 0 0 0 2px #bbb; z-index: 7; pointer-events: none; opacity: 0; }
  #chalkFly.on { animation: chalk .45s ease-in forwards; }
  @keyframes chalk { 0% { opacity: 1; transform: translate(0, 0) rotate(0) scale(.4); } 85% { opacity: 1; transform: translate(10vw, 25vh) rotate(540deg) scale(3); } 100% { opacity: 0; transform: translate(10vw, 25vh) rotate(600deg) scale(3.2); } }
  /* 初めてのヒント（黄色い付せん） */
  #tip { position: absolute; left: 50%; bottom: 64px; z-index: 8; pointer-events: none; transform: translateX(-50%) rotate(-1.5deg); width: max-content; max-width: min(420px, 88vw); padding: 8px 14px; background: #fff3a8; color: #3a2a12; border: 2px solid #c9a93a; border-radius: 4px; box-shadow: 0 4px 0 rgba(0,0,0,.25); font-size: 15px; font-weight: bold; line-height: 1.5; opacity: 0; transition: opacity .25s; }
  #tip::before { content: "ヒント"; display: inline-block; margin-right: 8px; padding: 0 6px; border-radius: 3px; background: #e0a020; color: #fff; font-size: 11px; vertical-align: 2px; }
  #tip.on { opacity: 1; }
  #tip.up { bottom: auto; top: 26%; }   /* 問題や休み時間の欄が出ているときは、その上に出す */
  #banner small.b2 { font-size: 15px; margin-top: 4px; color: #ffd75e; }
  #pauseBtn { pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; border: 3px solid #222; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.35); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  #pauseBtn i { display: block; width: 6px; height: 18px; border-radius: 2px; background: #222; }
  #gumTag { margin-top: 4px; padding: 2px 10px; border-radius: 10px; background: #ff8fb1; color: #fff; font-size: 12px; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  #sleepBox { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 6; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 6px; height: min(48vh, 380px); }
  #eye { position: relative; flex: none; width: 50px; height: 30px; border-radius: 50% / 60%; border: 3px solid #222; background: #fff; overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  #pupil { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #2b2622; }
  #eyeLid { position: absolute; left: 0; right: 0; top: 0; height: 0; background: #efcfae; border-bottom: 3px solid #222; }
  #gauge { position: relative; flex: 1; width: 34px; border-radius: 999px; border: 3px solid #fff; background: rgba(20,16,12,.55); overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.35); }
  #gaugeFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 999px; background: linear-gradient(0deg, #8fd3ff, #b48cff 55%, #ff5f7e); }
  #gaugeLine { position: absolute; bottom: 80%; left: 0; right: 0; height: 3px; background: rgba(255,255,255,.85); }
  #gaugeText { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); writing-mode: vertical-rl; color: #fff; font-size: 14px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  #gaugeNum { min-width: 40px; padding: 1px 6px; border-radius: 10px; background: rgba(20,16,12,.75); border: 2px solid #fff; color: #fff; font-size: 18px; font-weight: 900; text-align: center; }
  #sleepBox.danger #gaugeNum { background: #ff5f7e; }
  #sleepBox.danger #gauge { animation: danger .5s ease-in-out infinite alternate; }
  #sleepBox.danger #eye { animation: shake .25s linear infinite; }
  @keyframes danger { from { border-color: #fff; } to { border-color: #ff5f7e; box-shadow: 0 0 14px #ff5f7e; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 50% { transform: translateX(2px); } }

  .bubble { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(560px, 90vw); background: #fff; color: #222; padding: 10px 18px; border-radius: 18px; border: 3px solid #222; font-size: 18px; font-weight: bold; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .2s; text-align: center; line-height: 1.5; }
  .bubble.on { opacity: 1; }
  .bubble b { display: block; font-size: 12px; color: #777; }
  #bubble { top: 176px; }
  #bubbleText { display: inline-block; }
  #me { bottom: 22%; background: #ffe9a8; }

// ===== 確認用（ふつうに遊ぶ人には見えない）=====

const cam = document.getElementById('camera');
const EYE = { x: 0, y: -122, z: 0 };   // 自分の目の位置（見えない面を作らないために使う）
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * f));
  const g = Math.min(255, Math.round(((n >> 8) & 255) * f));
  const b = Math.min(255, Math.round((n & 255) * f));
  return `rgb(${r},${g},${b})`;
}
function face(parent, o) {
  const d = document.createElement('div');
  d.className = 'f ' + (o.cls || '');
  d.style.width = o.w + 'px';
  d.style.height = o.h + 'px';
  d.style.transform = `translate3d(${o.x - o.w / 2}px,${o.y - o.h / 2}px,${o.z}px) rotateY(${o.ry || 0}deg) rotateX(${o.rx || 0}deg) rotateZ(${o.rz || 0}deg)`;
  if (o.bg) d.style.background = o.bg;
  if (o.html) d.innerHTML = o.html;
  parent.appendChild(d);
  return d;
}
function group(parent, x, y, z, ry = 0) {
  const g = document.createElement('div');
  g.className = 'g';
  g.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg)`;
  parent.appendChild(g);
  return g;
}
// 箱。光は左の窓から入る想定で、面ごとに明るさを変える。
// 動かない物（部屋の家具）は、自分の席から見えない面を作らない（軽くするため）
function box(parent, x, y, z, w, h, d, color, opt = {}) {
  const c = (f) => shade(color, f);
  const fixed = parent.dataset.fixed === '1';
  const see = (nx, ny, nz, fx, fy, fz) => !fixed || (EYE.x - fx) * nx + (EYE.y - fy) * ny + (EYE.z - fz) * nz > -1;
  if (see(0, 0, 1, x, y, z + d / 2)) face(parent, { w, h, x, y, z: z + d / 2, bg: opt.front || c(0.86) });
  if (see(0, 0, -1, x, y, z - d / 2)) face(parent, { w, h, x, y, z: z - d / 2, ry: 180, bg: opt.back || c(0.6) });
  if (see(-1, 0, 0, x - w / 2, y, z)) face(parent, { w: d, h, x: x - w / 2, y, z, ry: -90, bg: c(0.97) });
  if (see(1, 0, 0, x + w / 2, y, z)) face(parent, { w: d, h, x: x + w / 2, y, z, ry: 90, bg: c(0.68) });
  if (see(0, -1, 0, x, y - h / 2, z)) face(parent, { w, h: d, x, y: y - h / 2, z, rx: 90, bg: opt.top || c(1.05) });
}

let roomG = null;
function roomOf(sub) { return sub === '理科' ? 'science' : sub === '音楽' ? 'music' : 'classroom'; }
const ROOM_NAMES = { classroom: '教室', science: '理科室', music: '音楽室' };
function buildRoom(kind) {
  if (roomG) roomG.remove();

  face(R, { cls: 'wall' + music, w: ROOM.w, h: ROOM.h, x: 0, y: -ROOM.h / 2, z: ROOM.front });
  face(R, { cls: 'wallL' + music, w: depth, h: ROOM.h, x: -ROOM.w / 2, y: -ROOM.h / 2, z: midZ, ry: 90 });
  face(R, { cls: 'wall' + music, w: depth, h: ROOM.h, x: ROOM.w / 2, y: -ROOM.h / 2, z: midZ, ry: -90 });
  face(R, { w: ROOM.w, h: 14, x: 0, y: -7, z: ROOM.front + 1, bg: '#7a5432' });
  face(R, { w: depth, h: 14, x: -ROOM.w / 2 + 1, y: -7, z: midZ, ry: 90, bg: '#7a5432' });
  face(R, { w: depth, h: 14, x: ROOM.w / 2 - 1, y: -7, z: midZ, ry: -90, bg: '#7a5432' });

  // 音楽室は黒板の上に肖像画を並べるので、黒板を少し低く小さくする
  const board = kind === 'music'
    ? face(R, { cls: 'board staff', w: 600, h: 155, x: -20, y: -170, z: ROOM.front + 2 })
    : face(R, { cls: 'board', w: 600, h: 165, x: -20, y: -175, z: ROOM.front + 2 });

  box(R, -20, -90, ROOM.front + 8, 600, 5, 14, '#8a5a33');

  clock.innerHTML = '<div class="hand" id="hHour" style="width:4px;height:14px;margin-left:-2px"></div><div class="hand" id="hMin" style="width:3px;height:20px;margin-left:-1.5px"></div>';
  if (kind === 'science') {
    // 周期表のポスター
    const cells = Array.from({ length: 40 }, (_, i) => `<i style="background:${['#f2c14e', '#7fc8a9', '#8fb8e8', '#f29e8e'][i % 4]}"></i>`).join('');
    face(R, { cls: 'ptable', w: 130, h: 90, x: 370, y: -170, z: ROOM.front + 2, html: `<b>周期表</b><div>${cells}</div>` });
  } else {

    notice.innerHTML = '<div class="paper" style="left:8px;top:8px;width:44px;height:56px"></div><div class="paper" style="left:58px;top:12px;width:44px;height:30px;transform:rotate(3deg)"></div><div class="paper" style="left:60px;top:48px;width:40px;height:28px;transform:rotate(-2deg)"></div>';
  }

  for (let i = 0; i < 4; i++) {
    const z = ROOM.front + 170 + i * 260;

    if (kind === 'music') for (const dz of [-122, 122]) face(R, { cls: 'curtain', w: 34, h: 185, x: -ROOM.w / 2 + 4, y: -168, z: z + dz, ry: 90 });   // えんじ色のカーテン
    const s = face(R, { cls: 'sun', w: 120, h: 170, x: -ROOM.w / 2 + 120, y: -0.6, z: z + 60, rx: 90 });
    s.style.transform += ' skewY(-24deg)';
  }
  doorEl = face(R, { cls: 'door', w: 120, h: 230, x: ROOM.w / 2 - 2, y: -115, z: DOOR_Z, ry: -90 });
  // 蛍光灯：箱をやめて、光る板1枚にした（軽くするため）
  for (let r = 0; r < 3; r++) for (let c = -1; c <= 1; c += 2) {

// 人体模型が突き抜けないよう、床に置いてある物の場所（上から見た四角）を覚えておく

function addBlock(x, z, w, d) { BLOCKS.push({ x, z, w, d }); }

  const s = [];
  if (room === 'science') {
    for (const z of LAB_Z) for (const x of LAB_X) for (const dx of LAB_SEAT_DX) {
      s.push({ x: x + dx, z: z + 32, front: x === 0 && z === LAB_Z[0] });   // 真ん前の台は空ける

    for (const z of ROWS) for (const x of COLS) {

      if (S.seatZ && x === 0 && z === ROWS[ROWS.length - 1]) continue;          // 席替えで自分が座っている席
      s.push({ x, z, front: x === 0 && z === -200 });

  return s;
}

    S.boss = { patrols: P.bossPatrolAt.slice(), stage: null, t: 0 };

}
// ===== 左上の時間割表 =====
// 今の時限をふくむ6時限分（1〜6限、7〜12限…）を並べる。今の時限は色つき＋先生のクセ＋残り時間のバー、
// 終わった時限は「済」のハンコ、6限ごとの学年主任の授業は先に書いておく（作戦を立てられるように）
function renderTimetable(inBreak = false) {
  const p = Math.max(1, S.period || 1);
  const first = p - ((posInDay(p) - 1) % 6);
  const ph = phaseOf(p);
  el('ttTitle').textContent = `${dayOf(p) > 1 ? dayOf(p) + '日目 ' : ''}時間割 ${first}〜${first + 5}時間目`;
  el('pPhase').textContent = ph.name;
  el('pPhase').className = ph.key;
  let html = '';
  for (let q = first; q < first + 6; q++) {
    const sub = S.timetable ? subjectOf(q) : '';
    const now = q === S.period && S.period > 0 && !inBreak;
    const next = q === S.period && inBreak;
    const boss = posInDay(q) % 6 === 0;
    const room = roomOf(sub) !== 'classroom' ? ROOM_NAMES[roomOf(sub)] : '';
    let note = '';
    if (now) note = boss ? '学年主任' : ttype().name;
    else if (next) note = '次の授業';
    else if (boss) note = '学年主任';
    else if (q > p && room) note = room;
    const cls = ['tt-row', q < S.period ? 'done' : '', now || next ? 'now' : '', boss ? 'boss' : ''].join(' ');
    html += `<div class="${cls}"><span class="n">${q}</span><span class="s">${esc(sub)}</span><span class="t">${esc(note)}</span>`
      + (now ? '<div class="bar"><div id="pTimeFill"></div><div id="pCalls"></div></div>' : '') + '</div>';
  }
  el('ttRows').innerHTML = html;
}
// 指名のタイミング：1限は2回、2限からは2回2割・3回5割・4回3割。間は最低 callGap 秒あける
function makeCalls(len = P.lessonSec) {
  let n = P.callsFirst;
  if (S.period > P.easyPeriods) {   // 2限から：callsRate の割合で 2・3・4回
    let r = Math.random(); n = 2;
    for (const [k, w] of P.callsRate) { if (r < w) { n = k; break; } r -= w; }
  }
  n += Math.floor(Math.max(0, S.period - 2) / P.callsGrowEvery);   // 時限が進むほど増える
  const gap = Math.max(P.callGapMin, P.callGap / tempo());
  n = Math.max(1, Math.min(n, Math.floor((len - 15) / gap) + 1));
  // 10秒〜（終わりの5秒前）を n 等分して、それぞれの中で少しずらす（間は必ず gap 秒以上あく）
  const span = (len - 15) / n, jitter = Math.max(0, span - gap);
  return Array.from({ length: n }, (_, i) => 10 + i * span + rand(0, jitter));
}

function say(text, speaker, garble = false) {

function drawBubble() {
  const tk = S.talk; if (!tk) return;
  const r = tk.garble ? Math.max(0, Math.min(1, (tk.maxLid - 0.2) / 0.65)) : 0;
  let out = '';

  out = out.replace(/・{2,}/g, '……');

  el('bubbleText').style.filter = r > 0 ? `blur(${(r * 1.6).toFixed(1)}px)` : '';

  else c.textContent = t;

// ===== 先生が話す（目を閉じていると、虫食いでしか聞こえない） =====
function talk() {
  const sub = S.subject, ph = S.phase;
  let line, fact = null;
  if (Math.random() < 0.4) {
    const c = pick(CHATS)();

// 1回のゲームの中で、同じ問題は2度出さない
function pickFresh(list, key) {
  let fresh = list.filter((x, i) => !S.used.has(key + i));
  if (!fresh.length) { list.forEach((x, i) => S.used.delete(key + i)); fresh = list; }
  const item = pick(fresh);
  S.used.add(key + list.indexOf(item));
  return item;
}
function choiceQ(sub, prompt, ans, wrongs, cause, opt = {}) {
  const ws = shuffle(wrongs.filter((w) => w !== ans).filter((w, i, a) => a.indexOf(w) === i)).slice(0, 2);
  const choices = [{ text: ans, correct: true }, ...ws.map((w) => ({ text: w }))];
  // 眠いと、寝ぼけた答えが混ざる
  if (S.sleep > 50 && Math.random() < (S.sleep - 40) / 70) choices[2] = { text: pick(SLEEPY_ANSWERS), sleepy: true };
  return { kind: 'choice', sub, prompt, choices: shuffle(choices), cause, ...opt };
}

  else if (type === 'sub') { const a = randInt(41, 99), b = randInt(12, 38); prompt = `${a} − ${b} = ?`; ans = a - b; wr = [ans + 10, ans - 10, ans + 2]; }
  else if (type === 'eq') { const x = randInt(2, 9), a = randInt(2, 7), b = randInt(1, 15); prompt = `${a}x + ${b} = ${a * x + b}　x = ?`; ans = x; wr = [x + 1, x - 1, x + 2]; }
  else if (type === 'neg') { const a = randInt(2, 9), b = randInt(2, 9); prompt = `(−${a}) × ${b} = ?`; ans = -a * b; wr = [a * b, -a * b - b, -a * b + a]; }
  else if (type === 'mul2') { const a = randInt(12, 29), b = randInt(3, 9); prompt = `${a} × ${b} = ?`; ans = a * b; wr = [ans + b, ans - b, ans + 10]; }
  else if (type === 'sq') { const n = randInt(11, 19); prompt = `${n}² = ?`; ans = n * n; wr = [ans + n, ans - n, ans + 10]; }

  else if (type === 'quad') { const a = randInt(1, 5), b = randInt(a + 1, 8); prompt = `x² − ${a + b}x + ${a * b} = 0 の解は？`; ans = `x = ${a}, ${b}`; wr = [`x = −${a}, −${b}`, `x = ${a + 1}, ${b - 1}`, `x = ${a}, ${b + 1}`]; }

// ===== 理科の実験（5種類）。どれも「ちょうどいい瞬間に『止める！』を押す」 =====

const LABS = {

function makeQuestion(noBeaker) {

  if (S.period <= P.easyPeriods && !S.test) return easyQuestion();
  if (S.facts.length && listenOK() && Math.random() < 0.3) { S.listenUsed++; return qListen(); }
  const kind = SUBJECTS[sub].quiz;
  if (kind === 'math') return qMath();
  if (sub === '社会' && Math.random() < P.photoRate) { const q = qPhoto(); if (q) return q; }
  if (kind === 'english') return qEnglish();
  if (kind === 'music') return qMusic();

  if (kind === 'science' && !noBeaker && !S.lastBeaker && Math.random() < P.beakerRate) { S.lastBeaker = true; return qLab(); }

}

// peek=教頭先生がドアからのぞく / phone=先生のスマホが鳴って出ていく / test=抜き打ち小テスト / flash=停電して懐中電灯で照らされる

    el('dark').style.opacity = 1;

function down(e) {

  if (e && e.target && e.target.closest && e.target.closest('.ui')) return;
  // ガム：ダブルタップで飲み込む
  if (mode === 'play') {
    const now = performance.now();
    if (S.gum && now - S.lastTap < P.doubleTapMs) swallowGum();

  }
  // 学年主任の「起立！」：押したら立つ（目は閉じない）。「礼」「着席」の間も押しても目は閉じない
  if (mode === 'play' && S.boss && (S.boss.stage === 'stand' || S.boss.stage === 'rei')) { S.standOK = true; S.holding = false; return; }

// ===== 真夜中の音楽室：肖像画の見張り =====
// 暗い（安全）→ 目がちらつく（予兆）→ 目が強く光る（見られている。寝ていたらアウト）→ 暗い…
// 先生が振り向く時間と重ならないよう、先生が黒板を向いているときだけ始め、その間は先生は振り向かずに待つ
function stepPortraits(dt) {
  const pt = S.port; if (!pt) return;

  } else if (pt.state === 'warn') {

    else pt.closed = 0;
    // 見張りが終わったら、先生はしばらく黒板を向いたまま（目を休める時間をつくる）
    if (pt.t <= 0) { pt.state = 'dim'; pt.t = rand(P.portGapMin, P.portGapMax); body.remove('port-watch'); if (S.tState === 'board') S.tTimer = Math.max(S.tTimer, rand(1.8, 2.8)); }

// チョーク投げ先生：寝ているのを見つけると、1回だけチョークを投げて起こす（×が1つ付く）
function throwChalk() {
  S.chalkUsed = true; S.closedTime = 0; S.holding = false; S.lid = 0;
  S.sleep = Math.max(0, S.sleep - 15);

  const c = el('chalkFly'); c.classList.remove('on'); void c.offsetWidth; c.classList.add('on');
  teacher.setMood('angry');
  say(`${playerName}！ 起きろ！`, speakerName());
  floatText('コツン！ ……痛っ', 1.3);

function animateTeacherArm() {
  const a = teacher.writing && S.tState === 'board' && mode === 'play' ? 145 + Math.sin(S.t * 14) * 8 : 0;
  teacher.armR.style.transform = `translate3d(38px,-150px,0) rotateX(${a}deg)`;

// ===== メインループ =====
let last = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000 || 0);
  last = now;
  if (mode !== 'pause') tick(dt);
  render();
  requestAnimationFrame(loop);
}
function tick(dt) {
  S.t = (S.t || 0) + dt;
  runTimers(dt);
  if (mode === 'play') step(dt);
  else if (mode === 'quiz') stepQuiz(dt);
  else if (mode === 'call') { S.lid += (0 - S.lid) * Math.min(1, dt * 9); }
  else if (mode === 'break') stepBreak(dt);
  else if (mode === 'mini') stepMini(dt);
  if (mode === 'play' || mode === 'call' || mode === 'quiz') stepFx(dt);   // にぎやかしの動き
  if (S.bubbleTimer > 0) { S.bubbleTimer -= dt; if (S.bubbleTimer <= 0) el('bubble').classList.remove('on'); }
  if (S.floatTimer > 0) { S.floatTimer -= dt; if (S.floatTimer <= 0) el('float').classList.remove('on'); }
  if (S.cueTimer > 0) { S.cueTimer -= dt; if (S.cueTimer <= 0) el('cue').classList.remove('on'); }
  if (S.tipTimer > 0) { S.tipTimer -= dt; if (S.tipTimer <= 0) el('tip').classList.remove('on'); }
  if (teacher) animateTeacherArm();
}
function step(dt) {
  S.lessonT += dt; S.lessonTotal += dt;
  stepDrink(dt);
  if (S.warmT > 0) S.warmT -= dt;
  if (S.lullT > 0) S.lullT -= dt;
  if (S.dropT > 0) S.dropT -= dt;
  if (S.energy && !S.energyDone && S.lessonT >= lessonLen() / 2) { S.energyDone = true; S.sleep = Math.min(99, S.sleep + P.energyBack); cue(`反動が来た……眠気 +${P.energyBack}`, 1.8); }
  // 怪談を聞いたあと：何も起きないのに、足音や物音がする（本物の予兆とまぎらわしい）
  if (S.spooky && S.spookyAt && S.spookyAt.length && S.lessonT >= S.spookyAt[0]) {
    S.spookyAt.shift();
    const k = Math.floor(Math.random() * 3);
    if (k === 0) { footstep(); later(0.4, footstep); cue('（コツ……コツ……）', 1.2); }
    else if (k === 1) { noise(0.3, 600, 0.4, 'bandpass'); cue('（ギシッ……）', 1.2); }
    else cue('（……今、何か通った？）', 1.4);
  }
  if (S.chatterAt > 0 && S.lessonT >= S.chatterAt && !S.event && S.tState === 'board' && !(S.boss && S.boss.stage)) { S.chatterAt = -1; chatter(DEV.event.startsWith('chat:') ? DEV.event.slice(5) : null); }
  if (S.sleepTime >= 180) award(0);
  if (S.lessonT >= lessonLen() && !S.event && !(S.boss && S.boss.stage && S.boss.stage !== 'done')) return endPeriod();

  // 眠いと勝手にまぶたが落ちてくる
  S.driftBlink = Math.max(0, S.driftBlink - dt);
  if (S.sleep > P.dangerAt && Math.random() < dt * (S.sleep - P.dangerAt + 10) / 40) S.driftBlink = rand(0.4, 0.9);
  let target = S.holding ? 1 : 0;
  // 勝手に落ちるまぶたは「寝ている」判定の手前で止める（自分で防げないアウトをなくすため）
  if (!S.holding && S.driftBlink > 0) target = Math.min(P.caughtLid - 0.07, 0.3 + (S.sleep - P.dangerAt) / 60);
  S.lid += (target - S.lid) * Math.min(1, dt * (S.holding ? 7 : 9));

  if (S.groggy > 0) S.groggy -= dt;
  if (S.lid > 0.8) { S.sleep = Math.max(0, S.sleep - P.sleepDown * recoverTempo() * dt); S.sleepTime += dt; S.wasClosed = true; }   // 睡眠時間（チャレンジ用）
  else if (S.boss && (S.boss.stage === 'stand' || S.boss.stage === 'rei')) {}   // 「起立！」〜「着席」の間は眠気がたまらない
  else S.sleep = Math.min(100, S.sleep + sleepRate() * dt);
  if (S.lid < P.caughtLid) S.awakeTime += dt;   // 起きていた時間（スコア）
  if (S.wasClosed && S.lid < P.caughtLid) { S.wasClosed = false; S.lastOpenAt = S.t; }   // 目を開けた瞬間（セーフ判定に使う）

  // 話している最中に目を閉じると、そこから先が聞き取れなくなる
  if (S.talk && S.talk.garble && S.bubbleTimer > 1.4 && S.lid > S.talk.maxLid) { S.talk.maxLid = S.lid; drawBubble(); }
  S.talkTimer -= dt;
  if (S.talkTimer <= 0 && S.tState !== 'warn' && !S.event && teacher.g.style.display !== 'none') { talk(); S.talkTimer = rand(P.talkMin, P.talkMax); }

  // イベントは、先生が少し黒板を向いていて、眠気が高すぎないときに始める（始まったら目を開け続ける時間があるので）
  // 次のイベントを列から出す（前のイベントが終わってから）
  if (S.evQ && S.evQ.length && S.eventAt < 0 && S.chatterAt < 0 && !S.event && S.lessonT >= S.evQ[0].at) {
    const e = S.evQ.shift();
    if (e.chat) S.chatterAt = S.lessonT + 0.01; else { S.eventType = pickEvent(S.phase, S.sleep > P.dangerAt); S.eventAt = S.lessonT + 0.01; }
  }
  if (!S.event && S.eventAt > 0 && S.lessonT >= S.eventAt && S.tState === 'board' && S.boardT >= P.minBoardGap && (S.sleep <= P.eventMaxSleep || CHANCE_TYPES.has(S.eventType)) && (!S.port || S.port.state === 'dim')) { S.eventAt = -1; startEvent(S.eventType); }
  const tdt = dt * tempo();   // 先生の時間
  stepEvent(tdt);
  if (mode !== 'play') return;
  stepBossEntry(tdt);
  stepBossEnd(dt);
  if (mode !== 'play') return;
  stepPortraits(dt);
  if (mode !== 'play') return;
  stepTeacher(tdt);
  if (mode !== 'play') return;

  if (S.period === DEV.start && S.lessonT > 12) el('hint').style.opacity = 0;

  // 先生に見られている間に寝ていたらアウト（チョーク投げ先生は、1回目だけチョークで起こしてくれる）
  if (teacher.facing && teacher.g.style.display !== 'none' && S.lid > P.caughtLid) {
    S.closedTime += dt;
    if (S.closedTime > P.caughtSec) {
      if (S.ttype === 'chalk' && !S.chalkUsed) throwChalk();

    }

  if (S.sleep >= 100) return gameOver('sleep');
}

// ===== 昼休みのミニゲーム =====
// どれも「押す」だけで遊べる。5秒くらいで終わる。結果で眠気の下がり方が変わる
// pan＝連打でライバルに勝つ / curry＝ルーのゲージをちょうどいい所で止める / volley＝落ちてくるボールを3回レシーブ
const MINI = {
  pan: { title: '焼きそばパン争奪戦', how: '連打！ ライバルより多く押せ（3秒）' },
  curry: { title: '学食のカレー', how: 'ルーが緑の所に来たら押して止めろ' },
  volley: { title: '中庭でバレー', how: 'ボールが手に来た瞬間に押せ（3回）' },
};
let M = null;
function startMini(kind) {
  mode = 'mini'; S.holding = false;
  const lv = S.miniPlays[kind] = (S.miniPlays[kind] || 0) + 1;   // 何回目か（2回目から少しずつ難しく）
  const k = lv - 1;
  M = { kind, t: -P.miniReady, n: 0, done: false, lv };   // t がマイナスの間は「よーい」
  if (kind === 'pan') { M.rival = 0; M.rivalRate = rand(P.panRivalMin, P.panRivalMax) + k * P.panRivalUp; }
  if (kind === 'curry') { M.v = 0; M.speed = P.currySpeed + k * P.curryUp; const w = Math.max(P.curryZoneMin, (P.curryZone[1] - P.curryZone[0]) - k * 3); M.zone = [P.curryZone[0], P.curryZone[0] + w]; }
  if (kind === 'volley') { M.ball = 0; M.hits = 0; M.y = -0.1; M.tried = false; M.wait = 0; M.mark = ''; M.fall = P.volleyFall.map((f) => f * Math.pow(P.volleyFaster, k)); }
  el('mTitle').textContent = MINI[kind].title + (lv > 1 ? `（${lv}回目）` : '');
  el('mHow').textContent = MINI[kind].how;
  el('mini').classList.remove('hidden');
  drawMini();
}
function miniPress() {
  if (!M || M.done || M.t < 0) return;
  if (M.kind === 'pan') { M.n++; tone(600 + Math.min(M.n, 40) * 12, 0, 0.05, 0.08, 'square'); }
  else if (M.kind === 'curry') finishMini();
  else if (M.kind === 'volley' && !M.tried && M.wait <= 0) {
    M.tried = true;
    if (volleyIn()) { M.hits++; M.mark = 'ナイス！'; M.hitAt = M.t; sfxOk(); }
    else { M.mark = M.y < 1 - P.volleyWindow ? '早すぎ……' : '遅すぎ……'; sfxNg(); }
    M.wait = 0.55;
  }
}
function stepMini(dt) {
  if (!M) return;
  M.t += dt;
  if (M.done) { if (M.t > M.endAt) closeMini(); drawMini(); return; }
  if (M.t >= 0) {
    if (M.kind === 'pan') { M.rival += M.rivalRate * dt; if (M.t >= P.panSec) finishMini(); }
    else if (M.kind === 'curry') { M.v += dt * (M.speed + M.t * 25); if (M.v >= 105) finishMini(); }
    else if (M.kind === 'volley') {
      if (M.wait > 0) {
        M.wait -= dt;
        if (M.wait <= 0) { M.ball++; if (M.ball >= 3) return finishMini(); M.y = -0.1; M.tried = false; M.mark = ''; }
      } else if (M.t >= 0.4) {   // 「ドン！」の文字が消えてから落ち始める（ボールに重ならないように）
        M.y += dt / M.fall[M.ball];
        if (M.y > 1 + P.volleyWindow && !M.tried) { M.tried = true; M.mark = '遅すぎ……'; sfxNg(); M.wait = 0.55; }
      }
    }
  }

}

    M.win = M.n > M.rival;
    M.down = M.win ? 45 : 5;
    M.msg = M.win ? '焼きそばパン、ゲット！' : 'ライバルに負けた……';
    if (M.win) sfxOk(); else sfxNg();
  } else if (M.kind === 'curry') {
    const v = Math.min(100, M.v);
    if (v >= M.zone[0] && v <= M.zone[1]) { M.down = 40; M.msg = 'ちょうどいいカレー！'; sfxOk(); }
    else if (v < M.zone[0]) { M.down = 20; M.msg = 'ルーが少なすぎた……'; sfxNg(); }
    else { M.down = 30; S.full = true; M.msg = 'ルー多すぎ！ 満腹で次の授業が少し眠い'; sfxNg(); }
  } else {
    M.down = Math.max(5, M.hits * 15);
    M.msg = `レシーブ ${M.hits}／3回`;
  }

function volleyIn() { return M.y >= 1 - P.volleyWindow && M.y <= 1 + P.volleyWindow * 0.6; }

}
function drawMini() {
  if (!M) return;
  const b = el('mBody');

  if (M.kind === 'pan') {
    const max = Math.max(30, M.n, M.rival);
    // 焼きそばパンが、押した回数の多い方へ寄っていく。終わったら勝った方の手に
    const lead = M.done ? (M.win ? -1 : 1) : Math.max(-1, Math.min(1, (M.rival - M.n) / 8));
    h += `<div class="panRow"><span class="who">あなた</span><div class="panTrack"><div class="yakisoba" style="left:${50 + lead * 28}%;transform:${M.done ? `scale(${(1 + 0.35 * Math.sin(Math.min(1, (M.t - M.doneAt) / 0.6) * Math.PI)).toFixed(2)})` : 'none'}"></div></div><span class="who">ライバル</span></div>`;
    h += `<div class="bar"><i style="width:${M.n / max * 100}%"></i><span>あなた ${M.n}</span></div>

    const up = M.hitAt != null && M.t - M.hitAt < 0.55 ? (M.t - M.hitAt) / 0.55 : 0;

      <div class="ball${!M.tried && M.wait <= 0 && volleyIn() ? ' in' : ''}" style="top:${by * 144}px"></div></div>
      <div style="font-size:15px;font-weight:900;margin-top:6px">${Math.min(M.ball + 1, 3)}球目　${M.mark}</div>`;
  }
  if (M.t < 0) h += `<div class="big" style="position:absolute;left:0;right:0;top:60px">よーい……</div>`;
  else if (M.t < 0.4 && !M.done) h += `<div class="big" style="position:absolute;left:0;right:0;top:60px">ドン！</div>`;
  if (M.done) h += `<div class="res">${esc(M.msg)}</div>`;
  b.innerHTML = h;

function drawEyeGlow() {
  const g = el('eyeGlow');

  const on = S.room === 'music' && S.phase && (night || ps === 'watch' || (ps === 'warn' && Math.floor(S.t * 12) % 2 === 0));

// あなたの居眠りタイプ（SLEEP_TYPES の番号）。上から順に当てはまるか調べる
function sleepType(r) {
  const grades = SUBJECT_NAMES.map((k) => subjectGrade(r.subj[k])).filter((v) => v !== '－');
  const mins = Math.max(1, r.lessonTotal / 60);
  const checks = [
    r.reached <= 2,                                              // 秒寝タイプ
    r.reached > 10,                                              // 夜型人間
    r.kind === 'miss' && r.lastSleepy,                           // 寝ぼけ回答タイプ
    r.testPerfect,                                               // 小テストの申し子
    r.bestCombo >= 5,                                            // ギリギリ職人
    r.sleepSec >= 120 && r.safeAll <= 3,                         // ガチ寝タイプ
    r.lessonTotal >= 120 && r.turns / mins >= 11,                // 振り向かれ王
    r.called >= 4 && r.called / r.reached >= 2.2,                // 指名されがち
    grades.length >= 3 && grades.filter((v) => v === 5).length === 1,   // 一点集中型
    r.nurse >= 2,                                                // 保健室の常連
    r.coffee >= 2,                                               // カフェイン頼み
    r.sleepSec < 60 && r.correct >= 5,                           // まじめな優等生
  ];
  const k = checks.indexOf(true);
  return k < 0 ? SLEEP_TYPES.length - 1 : k;
}

    record: { periods: r.reached, awake: r.awake, safeAll: r.safeAll, safe: r.bestCombo, turns: r.turns, called: r.called, correct: r.correct, test: r.tests },
    typeIdx: sleepType(r),
    events: { now: r.evNow, ever: r.evEver, total: r.evTotal },
  };
}
function shareText() {
  const r = S.result;
  return `【${TITLE}】${r.reached}時間目（${r.sub}）でアウト\n起きていた時間：${r.awake}\n死因：${r.cause}\n称号：${r.rank}\n#${TITLE}`;
}
function shareUrl() { return SITE_URL || (location.protocol.startsWith('http') ? location.href.split(/[?#]/)[0] : ''); }
// スマホで「画像つきの共有」ができるなら、結果の画像といっしょに共有する。できなければXの投稿画面を開く（文字だけ）
// Xでシェア：押したらすぐにXの投稿画面を開く（文とリンクは入った状態）。
// Xの投稿画面には外から画像を渡せないので、その前に通知表の画像をコピーしておき、貼り付ければ画像も付くようにする
async function share() {
  const url = shareUrl();
  const intent = 'https://x.com/intent/post?text=' + encodeURIComponent(shareText()) + (url ? '&url=' + encodeURIComponent(url) : '');
  const w = window.open('', '_blank');   // 先に開いておく（あとで開くと、ポップアップとして止められることがある）
  let copied = false;
  try {
    const blob = await resultBlob();
    if (navigator.clipboard && window.ClipboardItem) { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copied = true; }
  } catch (e) {}
  if (w) w.location.href = intent; else location.href = intent;
  el('shareNote').textContent = copied ? '通知表の画像をコピーしました。Xの投稿欄に貼り付けると、画像も付けられます。'
    : '画像も付けるときは「通知表を保存」で保存して、Xの投稿に付けてください。';
}
async function saveImage() {
  const blob = await resultBlob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `suimin-gakushu-${S.result.reached}jikanme.png`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ===== 結果を1枚の画像にする：本物っぽい「通知表」（Xに貼ったときに見やすい横長 1200x675） =====
// 中身の見本は tools/report-card-mock.html（見た目を直すときは、まず見本で相談してからこちらへ）
function resultBlob() { return S.cardBlob ? Promise.resolve(S.cardBlob) : new Promise((res) => drawResultCanvas().toBlob(res, 'image/png')); }
// 教科の評価（1〜5）：その教科で当てられた問題の正解の割合。当てられなかった教科は「－」
function subjectGrade(o) {
  if (!o || !o.a) return '－';
  const r = o.c / o.a;
  return r >= 1 ? 5 : r >= 0.7 ? 4 : r >= 0.45 ? 3 : r >= 0.2 ? 2 : 1;
}
// 担任の印鑑に入れる2文字（見つかった相手で変わる）
function stampText(catcher) {
  const m = { '教頭先生': '教頭', '肖像画': '肖像', '警備員さん': '警備', '校長先生': '校長', '学年主任': '主任', '補習の先生': '補習' };
  return m[catcher] || '担任';
}
// 担任のひとこと（遊び方によって変わる）
function teacherRemark(r) {
  if (r.sleepSec >= 300) return 'ある意味、才能があります。';
  if (r.bestCombo >= 4) return '起きているフリだけは一流です。';
  if (r.answered >= 4 && r.correct / r.answered >= 0.9) return '寝ているのに成績は優秀。なぜでしょう。';
  if (r.sleepSec < 30) return 'もう少し、上手に寝ましょう。';
  if (r.reached >= 10) return '夜の学校には、もう来ないように。';
  return '次は、もう少しバレずに寝ましょう。';
}
function drawResultCanvas() {
  const W = 1200, H = 675;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const MIN = '"Hiragino Mincho ProN","Yu Mincho","MS Mincho",serif';
  const GOT = '"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  const HAND = '"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif';
  const INK = '#2a2520', RED = '#c8322a', BLUE = '#1f3f7a';
  function txt(s, x, y, size, o = {}) {
    g.font = `${o.w || 700} ${size}px ${o.f || MIN}`; g.textAlign = o.a || 'left'; g.textBaseline = o.b || 'alphabetic';
    g.fillStyle = o.c || INK; g.fillText(s, x, y);
  }
  function line(x1, y1, x2, y2, w = 2, c = INK) { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
  function box(x, y, w, h, lw = 2, c = INK) { g.strokeStyle = c; g.lineWidth = lw; g.strokeRect(x, y, w, h); }
  function fit(s, size, maxW, f, w = 700) { let fs = size; g.font = `${w} ${fs}px ${f}`; while (fs > 10 && g.measureText(s).width > maxW) { fs--; g.font = `${w} ${fs}px ${f}`; } return fs; }
  // 日本語の読みやすい改行：
  // ・文（。で終わる）ごとに新しい行から書く
  // ・「」でくくった言葉は、うしろの1文字（に・と・を など）とまとめて、途中で切らない
  // ・行の頭に 、。」）！？ー が来ないようにし、行の終わりに「（ が来ないようにする
  // 文を「ここで改行してよい」所で区切る：助詞（は・が・の・を・に・で・と・へ・も・や・から・まで・より）や 、？！ のあと
  const NO_HEAD = '、。」』）！？ー…', NO_TAIL = '「『（';
  function splitPhrases(s) {
    const out = []; let cur = '';
    const cs = [...s];
    for (let i = 0; i < cs.length; i++) {
      cur += cs[i];
      const c = cs[i], n = cs[i + 1] || '';
      const two = cs[i - 1] + c;
      let brk = '、？！'.includes(c) || 'はがのをにでとへもや'.includes(c) || ['から', 'まで', 'より'].includes(two);
      if (NO_HEAD.includes(n)) brk = false;          // 次が 、。」 などなら、まだ切らない
      if (n === '「' || n === '『') brk = true;       // 「 の前では切ってよい
      if (NO_TAIL.includes(c)) brk = false;           // 「 のあとでは切らない
      if (brk || !n) { out.push(cur); cur = ''; }
    }
    if (cur) out.push(cur);
    return out;
  }
  function wrapJa(s, x, y, maxW, size, lh, o = {}) {
    g.font = `${o.w || 700} ${size}px ${o.f || MIN}`;
    const sentences = s.match(/[^。]+。?/g) || [s];
    let yy = y;
    sentences.forEach((sen, si) => {
      // 「」でくくった言葉は、うしろの助詞までふくめて1つのかたまりにする（1行に入るなら途中で切らない）
      const toks = [];
      const re = /「[^」]*」[にとをがはのへで]?|[^「]+/g;
      for (const m of sen.match(re) || []) {
        if (m.startsWith('「') && g.measureText(m).width <= maxW) toks.push(m);
        else toks.push(...splitPhrases(m));
      }
      // 行の頭に来てはいけない文字は、前のかたまりにくっつける
      for (let i = 1; i < toks.length; i++) if (NO_HEAD.includes(toks[i][0])) { toks[i - 1] += toks[i]; toks.splice(i, 1); i--; }
      let cur = '';
      for (const t of toks) {
        if (cur && g.measureText(cur + t).width > maxW) { txt(cur, x, yy, size, o); yy += lh; cur = t; }
        else cur += t;
        // それでも1行より長いときだけ、しかたなく文字の途中で切る
        while (g.measureText(cur).width > maxW) {
          let k = cur.length; while (k > 1 && g.measureText(cur.slice(0, k)).width > maxW) k--;
          txt(cur.slice(0, k), x, yy, size, o); yy += lh; cur = cur.slice(k);
        }
      }
      if (cur) { txt(cur, x, yy, size, o); if (si < sentences.length - 1) yy += lh; }
    });
    return yy;
  }
  function stamp(x, y, s, r = 40) {
    g.save(); g.translate(x, y); g.rotate(-0.18);
    g.strokeStyle = RED; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke();
    txt(s[0], 0, -5, r * 0.72, { a: 'center', w: 900, c: RED }); txt(s[1], 0, r * 0.7, r * 0.72, { a: 'center', w: 900, c: RED });
    g.restore();
  }
  function heading(s, x, y) {   // 欄の見出し（左に黒い四角）
    g.fillStyle = INK; g.fillRect(x, y - 17, 6, 20);
    txt(s, x + 14, y, 20, { w: 900 });
  }
  function draw(d) {
    // 机と、開いた通知表
    g.fillStyle = '#7a5432'; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(0,0,0,.08)'; for (let i = 0; i < 10; i++) g.fillRect(0, i * 72 + 10, W, 3);
    g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(44, 30, W - 80, H - 52);
    g.fillStyle = '#fbf7ea'; g.fillRect(36, 22, W - 80, H - 52);
    g.fillStyle = 'rgba(0,0,0,.05)'; g.fillRect(W / 2 - 12, 22, 24, H - 52);
    line(W / 2, 22, W / 2, H - 30, 1, 'rgba(0,0,0,.18)');

    // ================= 左のページ =================
    const L = 70, R = W / 2 - 34;
    txt('通　知　表', L, 80, 44, { w: 900 });
    txt(`第${d.plays}学期`, R, 78, 24, { a: 'right', w: 900 });
    txt(`私立 ${TITLE}`, L, 118, 18);   // 学校名＝タイトル（タイトルを変えると自動で変わる）
    txt('氏名', R - 150, 118, 18);
    txt(d.name, R, 120, 30, { a: 'right', w: 900 });
    line(L, 132, R, 132, 3);

    // 学習のようす（教科×評価。2段×3列）
    heading('学習のようす', L, 166);
    const gx = L, gy = 178, cw = (R - L) / 3, ch = 46;
    d.subjects.forEach(([sub, val], i) => {
      const x = gx + (i % 3) * cw, y = gy + Math.floor(i / 3) * ch;
      box(x, y, cw, ch, 1.5);
      line(x + cw * 0.58, y, x + cw * 0.58, y + ch, 1);
      txt(sub, x + 14, y + ch / 2 + 8, 22, { w: 900 });
      const cx = x + cw * 0.79, cy = y + ch / 2;
      if (val === 5) { g.strokeStyle = RED; g.lineWidth = 2.5; g.beginPath(); g.arc(cx, cy, 18, 0, Math.PI * 2); g.stroke(); }
      txt(String(val), cx, cy + 11, 30, { a: 'center', w: 900, c: val === 5 ? RED : INK });
    });

    // 居眠りの記録（出欠の記録のかわり。左のページ、学習のようすの下）
    const ay = gy + ch * 2 + 34;
    heading('居眠りの記録', L, ay);
    const rc = d.record;
    const cols = [['授業時数', `${rc.periods}時間`], ['起きていた時間', rc.awake], ['セーフ', `${rc.safeAll}回`], ['セーフ最高', `×${rc.safe}`],
                  ['振り向かれた', `${rc.turns}回`], ['当てられた', `${rc.called}回`], ['正解', `${rc.correct}問`], ['小テスト', `${rc.test}回`]];
    const per = 4, acw = (R - L) / per, ach = 46;
    cols.forEach(([k, v], i) => {
      const x = L + acw * (i % per), y = ay + 12 + ach * Math.floor(i / per);
      box(x, y, acw, ach, 1.5);
      line(x, y + 20, x + acw, y + 20, 1);
      txt(k, x + acw / 2, y + 15, fit(k, 13, acw - 8, GOT), { a: 'center', f: GOT });
      txt(String(v), x + acw / 2, y + 41, fit(String(v), 20, acw - 10, MIN, 900), { a: 'center', w: 900 });
    });

    // 担任より（所見）
    const sy = ay + 12 + ach * 2 + 34;
    heading('担任より', L, sy);
    const bx = L, by = sy + 12, bw = R - L, bh = H - 60 - by;
    box(bx, by, bw, bh, 2);
    for (let y = by + 44; y < by + bh - 6; y += 40) line(bx + 12, y, bx + bw - 12, y, 1, 'rgba(60,90,140,.3)');
    wrapJa(d.comment, bx + 20, by + 34, bw - 110, 24, 40, { f: HAND, c: BLUE });
    stamp(bx + bw - 52, by + bh - 50, d.stamp, 36);

    // ================= 右のページ =================
    const L2 = W / 2 + 34, R2 = W - 74;
    // 行動の記録（10個のチャレンジ。今回とれた〇と、これまでにとった〇を2列で）
    heading('行動の記録', L2, 62);
    const hh = 22, ty = 74 + hh, rh = 27, cNow = R2 - 104, cEver = R2 - 52;
    // 列の見出し
    box(L2, 74, R2 - L2, hh + rh * d.behavior.length, 2);
    line(L2, ty, R2, ty, 1.5);
    line(cNow, 74, cNow, ty + rh * d.behavior.length, 1.5); line(cEver, 74, cEver, ty + rh * d.behavior.length, 1.5);
    txt('項目', L2 + 10, 74 + 16, 13, { f: GOT });
    txt('今回', (cNow + cEver) / 2, 74 + 16, 13, { a: 'center', f: GOT, w: 900 });
    txt('これまで', (cEver + R2) / 2, 74 + 16, 12, { a: 'center', f: GOT });
    d.behavior.forEach(([item, note, now, ever], i) => {
      const y = ty + rh * i;
      if (i) line(L2, y, R2, y, 1, 'rgba(0,0,0,.35)');
      txt(item, L2 + 10, y + rh / 2 + 6, 17, { w: 900 });
      // チャレンジの中身は、決まった位置に小さく灰色で（項目のほうを主役に）
      txt(note, cNow - 8, y + rh / 2 + 5, fit(note, 13, 130, GOT), { a: 'right', f: GOT, c: '#888' });
      if (now) { g.strokeStyle = RED; g.lineWidth = 2.5; g.beginPath(); g.arc((cNow + cEver) / 2, y + rh / 2, 10, 0, Math.PI * 2); g.stroke(); }
      if (ever) { g.strokeStyle = 'rgba(200,50,42,.45)'; g.lineWidth = 2; g.beginPath(); g.arc((cEver + R2) / 2, y + rh / 2, 9, 0, Math.PI * 2); g.stroke(); }
    });

    // 特別活動の記録：学校行事（イベント）を何種類見たか。全部見たら〇
    const evY = ty + rh * d.behavior.length + 8, ev = d.events;
    box(L2, evY, R2 - L2, 30, 2);
    line(cNow, evY, cNow, evY + 30, 1.5); line(cEver, evY, cEver, evY + 30, 1.5);
    txt('特別活動', L2 + 10, evY + 21, 15, { w: 900 });
    txt('学校行事（イベント）', L2 + 88, evY + 20, 12, { f: GOT, c: '#666' });
    txt(`今回 ${ev.now}種類　これまで ${ev.ever}／${ev.total}`, cNow - 8, evY + 20, fit(`今回 ${ev.now}種類　これまで ${ev.ever}／${ev.total}`, 12, 150, GOT), { a: 'right', f: GOT, c: '#555' });
    if (ev.ever >= ev.total) { g.strokeStyle = RED; g.lineWidth = 2.5; g.beginPath(); g.arc((cEver + R2) / 2, evY + 15, 10, 0, Math.PI * 2); g.stroke(); }

    // あなたの居眠りタイプ
    const ky = evY + 30 + 14;
    g.fillStyle = '#fff3a8'; g.fillRect(L2, ky, R2 - L2, H - 60 - ky);
    box(L2, ky, R2 - L2, H - 60 - ky, 2, '#c9a93a');
    txt('あなたの居眠りタイプ', L2 + 18, ky + 32, 18, { f: GOT, c: '#6a5420' });
    const tp = SLEEP_TYPES[d.typeIdx];
    txt(`『${tp[0]}』`, L2 + 10, ky + 88, fit(`『${tp[0]}』`, 48, R2 - L2 - 30, MIN, 900), { w: 900, c: RED });
    wrapJa(tp[2], L2 + 22, ky + 130, R2 - L2 - 40, 18, 28, { f: GOT, c: '#3a2a12' });   // 血液型占いのような診断

    // 下：ゲーム名とハッシュタグ
    txt(TITLE, L, H - 38, 20, { f: GOT, w: 900, c: '#2d4f3c' });
    const url = shareUrl().replace(/^https?:\/\//, '');
    if (url) { g.font = `900 20px ${GOT}`; txt(url, L + g.measureText(TITLE).width + 14, H - 39, 13, { f: GOT, c: '#8a7a60' }); }
    txt(`#${TITLE}`, R2, H - 38, 20, { a: 'right', f: GOT, w: 900 });
  }
  draw(reportData(S.result));
  return cv;
}

  store('inemuri-name', playerName);
  Object.assign(S, { sleep: P.sleepStart, lid: 0, holding: false, period: DEV.start, closedTime: 0, driftBlink: 0, misses: 0,
    bubbleTimer: 0, floatTimer: 0, cueTimer: 0, timers: [], timetable: {}, phase: null, lastCause: '', groggy: 0, late: false,
    revealCalls: false, test: null, event: null, used: new Set(), talk: null, cups: P.cupStart, cafT: 0, drinking: null, prep: false, suspect: false, lastBeaker: false,
    sleepTime: 0, awakeTime: 0, combo: 0, bestCombo: 0, correct: 0, answered: 0, lastOpenAt: -99, wasClosed: false, ttype: 'normal', lastTtype: null, chalkUsed: false, walk: null,
    // 通知表に使う記録
    safeAll: 0, turns: 0, called: 0, tests: 0, testPerfect: false, nurse: 0, coffee: 0, soldStreak: 0, lastSleepy: false, lessonTotal: 0,
    subj: {}, seenT: new Set(), got: new Set(), awardQ: [], awardBusy: false, seatZ: 0, boss: null, entry: null, camLiftTo: 0, forceWalk: false, standOK: false,
    double: false, hardQ: false, fastQ: false, preQ: null, forgive: false, proxy: false, warmT: 0, lullT: 0, chatterAt: -1,
    notes: false, notedQ: false, miniPlays: {}, evQ: [], evSeen: new Set(), usedEv: new Set(), listenBlock: -1, listenUsed: 0, listenQuota: 0, full: false, energy: false, energyDone: false, spooky: false, spookyAt: null, dropT: 0, gum: false, lastTap: 0, devLunch: false });
  if (!DEV.on) { plays = Number(store('inemuri-plays') || 0) + 1; store('inemuri-plays', String(plays)); }   // 遊んだ回数＝通知表の「第○学期」
  ['bubble', 'me', 'float', 'cue'].forEach((k) => el(k).classList.remove('on'));

  el('dark').style.opacity = 0;

    endPeriod();

  }
  setupPeriod();

}
el('startBtn').addEventListener('click', start);
el('cupBtn').addEventListener('click', (e) => { e.stopPropagation(); drinkCoffee(); });
el('retryBtn').addEventListener('click', start);
el('shareBtn').addEventListener('click', share);

// ===== 組み立て =====
buildRoom('classroom');

el('chalk').textContent = SUBJECTS['国語'].board[1][0];
el('boardDate').textContent = '十一月十九日（木）　日直　佐藤';
